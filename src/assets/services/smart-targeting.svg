<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Map with targeted location pins and a rising performance chart">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#78350f" flood-opacity="0.18"/>
    </filter>
    <clipPath id="map">
      <rect x="52" y="68" width="226" height="226" rx="12"/>
    </clipPath>
    <path id="pin" d="M0 0C-4-10-16-18-16-30a16 16 0 1 1 32 0C16-18 4-10 0 0z"/>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="350" cy="370" r="80" fill="#fed7aa" opacity="0.6"/>
  <circle cx="30" cy="30" r="70" fill="#fde68a" opacity="0.55"/>

  <!-- map card -->
  <g filter="url(#shadow)">
    <rect x="40" y="56" width="250" height="250" rx="20" fill="#ffffff"/>
  </g>
  <g clip-path="url(#map)">
    <rect x="52" y="68" width="226" height="226" fill="#fffaf0"/>
    <rect x="62" y="78" width="38" height="32" rx="4" fill="#fdecc8"/>
    <rect x="122" y="78" width="66" height="32" rx="4" fill="#fdecc8"/>
    <rect x="212" y="208" width="56" height="42" rx="6" fill="#bbf7d0"/>
    <rect x="62" y="212" width="38" height="38" rx="4" fill="#fdecc8"/>
    <path d="M40 166C110 140 160 196 300 168" fill="none" stroke="#bfdbfe" stroke-width="12"/>
    <g stroke="#fde1b0" stroke-width="7" stroke-linecap="round">
      <line x1="40" y1="122" x2="300" y2="122"/>
      <line x1="40" y1="200" x2="300" y2="200"/>
      <line x1="40" y1="262" x2="300" y2="262"/>
      <line x1="110" y1="56" x2="110" y2="306"/>
      <line x1="200" y1="56" x2="200" y2="306"/>
    </g>
    <line x1="40" y1="300" x2="300" y2="84" stroke="#fcd38d" stroke-width="9" stroke-linecap="round"/>

    <!-- target radius -->
    <circle cx="160" cy="184" r="72" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="160" cy="184" r="40" fill="#f97316" fill-opacity="0.14"/>

    <!-- pins outside target -->
    <use href="#pin" transform="translate(234 100) scale(0.55)" fill="#d6d3d1"/>
    <use href="#pin" transform="translate(76 286) scale(0.55)" fill="#d6d3d1"/>

    <!-- pins inside target -->
    <use href="#pin" transform="translate(118 160) scale(0.6)" fill="#f59e0b"/>
    <use href="#pin" transform="translate(200 222) scale(0.6)" fill="#f59e0b"/>
    <use href="#pin" transform="translate(196 140) scale(0.6)" fill="#f59e0b"/>
    <use href="#pin" transform="translate(132 236) scale(0.6)" fill="#f59e0b"/>
  </g>

  <!-- main pin -->
  <ellipse cx="160" cy="186" rx="9" ry="3.5" fill="#9a3412" opacity="0.25"/>
  <use href="#pin" transform="translate(160 184)" fill="url(#brand)"/>
  <circle cx="160" cy="154" r="6.5" fill="#ffffff"/>

  <!-- audience card -->
  <g filter="url(#shadow)">
    <rect x="248" y="84" width="112" height="58" rx="14" fill="#ffffff"/>
  </g>
  <circle cx="272" cy="113" r="11" fill="#fdba74" stroke="#ffffff" stroke-width="3"/>
  <circle cx="289" cy="113" r="11" fill="#fb923c" stroke="#ffffff" stroke-width="3"/>
  <circle cx="306" cy="113" r="11" fill="#f97316" stroke="#ffffff" stroke-width="3"/>
  <rect x="324" y="104" width="26" height="7" rx="3.5" fill="#78350f" opacity="0.75"/>
  <rect x="324" y="116" width="18" height="6" rx="3" fill="#fde68a"/>

  <!-- performance chart card -->
  <g filter="url(#shadow)">
    <rect x="214" y="226" width="150" height="122" rx="16" fill="#ffffff"/>
  </g>
  <rect x="230" y="242" width="60" height="8" rx="4" fill="#78350f" opacity="0.75"/>
  <rect x="316" y="238" width="34" height="16" rx="8" fill="#dcfce7"/>
  <path d="M327 249l6-6 6 6" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="234" y="306" width="18" height="26" rx="4" fill="#fde68a"/>
  <rect x="260" y="294" width="18" height="38" rx="4" fill="#fde68a"/>
  <rect x="286" y="280" width="18" height="52" rx="4" fill="#fcd34d"/>
  <rect x="312" y="262" width="18" height="70" rx="4" fill="url(#brand)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 302L264 290L290 294L334 266M321 265.4L334 266L329 278" stroke="#ffffff" stroke-width="9"/>
    <path d="M240 302L264 290L290 294L334 266M321 265.4L334 266L329 278" stroke="#c2410c" stroke-width="4"/>
  </g>

  <!-- sparkles -->
  <path d="M356 40q2 8 10 10q-8 2-10 10q-2-8-10-10q8-2 10-10z" fill="#f97316"/>
  <path d="M30 330q1.6 6.4 8 8q-6.4 1.6-8 8q-1.6-6.4-8-8q6.4-1.6 8-8z" fill="#f59e0b"/>
</svg>
